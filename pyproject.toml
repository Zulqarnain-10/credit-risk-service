[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-service"
version = "0.1.0"
description = "Credit-default risk model shipped as a product: versioned data, tracked experiments, tested API, CI/CD, live endpoint, drift monitoring."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Syed Zulqarnain Hassan" }]
dependencies = [
  "pandas>=2.2,<4",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4",
  "pyyaml>=6",
  "pydantic>=2.7,<3",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "httptools>=0.6",
  "prometheus-fastapi-instrumentator>=7",
  "httpx>=0.27",
  "python-json-logger>=2",
]

[project.optional-dependencies]
pipeline = [
  "dvc>=3.50",
  "mlflow>=2.14",
  "pandera>=0.20",
  "matplotlib>=3.9",
  "scipy>=1.13",
  "xlrd>=2.0",
  "ucimlrepo>=0.0.7",
  "evidently>=0.7",
]
monitoring = [
  "evidently>=0.4.30",
  "scipy>=1.13",
  "matplotlib>=3.9",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "pre-commit>=3.7",
  "huggingface_hub>=0.30",
]

[project.urls]
Homepage = "https://github.com/Zulqarnain-10/credit-risk-service"
Author = "https://zulqarnainhassan.com"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"credit_risk.api" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = [".venv", "mlruns", "data", ".space_build"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF012", "N803", "N806", "B008"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=credit_risk --cov-report=term-missing --cov-report=xml"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
markers = ["slow: trains a model on a small sample"]

[tool.coverage.run]
source = ["credit_risk"]
omit = ["*/loadtest.py"]
